l_english:
  wa_mp_fix_land_mastery_boost:0 "Doctrine Intensification (1939+)"
  wa_mp_fix_land_mastery_boost_desc:0 "From 1 January 1939 onward, Germany, Italy, and Japan accelerate land doctrine development, increasing doctrine mastery gain."
  wa_mp_fix_GER_unreliable_torpedoes:0 "Unreliable Torpedoes"
  wa_mp_fix_GER_unreliable_torpedoes_desc:0 "Defective exploders and depth-keeping issues have severely reduced the effectiveness of torpedoes and naval air strikes."
  
  ita_special_resources:0 "Italian Resource Program"
  ita_special_resources_desc:0 "Extra resources are available while Italy controls this state."
  
  wa_mp_fix_ita_oil_resources_libya:0 "Libyan Oil Development"
  wa_mp_fix_ita_oil_resources_libya_desc:0 "Additional oil output is available while Italy controls the state and after the focus \"Develop the Empire\" is completed."
  wa_mp_fix_germany.1.t:0 "France Capitulated"
  wa_mp_fix_germany.1.d:0 "With France out of the fight, Germany can redirect manpower to new fronts."
  wa_mp_fix_germany.1.a:0 "Proceed."
  
  wa_mp_fix_sov_industry.1.t:0 "Western Industrial Expansion: Riga, Minsk, Kyiv"
  wa_mp_fix_sov_industry.1.d:0 "New construction brigades and equipment are redirected to the western industrial belt. To concentrate output where it matters most, factory construction is being fast-tracked in Riga, Minsk, and Kyiv."
  wa_mp_fix_sov_industry.1.a:0 "Authorize the builds in Riga, Minsk, and Kyiv."
  
  wa_mp_fix_sov_industry.2.t:0 "Western Arsenal Program: Riga, Minsk, Kyiv"
  wa_mp_fix_sov_industry.2.d:0 "Production is shifted toward military needs. New military plants in Riga, Minsk, and Kyiv will shorten delivery times and reduce strain on long-distance supply routes."
  wa_mp_fix_sov_industry.2.a:0 "Expand the arsenal in Riga, Minsk, and Kyiv."
  
  wa_mp_fix_sov_industry.3.t:0 "Resource Corridor Beyond the Urals"
  wa_mp_fix_sov_industry.3.d:0 "Engineering units are dispatched to expand roads, depots, and utilities around remote extraction hubs. Better logistics means more reliable output."
  wa_mp_fix_sov_industry.3.a:0 "Send the engineers."

  wa_mp_fix_ita_boost_resources:0 "Steel Mobilized for the Fleet"
  wa_mp_fix_ita_boost_resources_desc:0 "Italy has redirected steel output in this state to naval construction and refit programs, tightening civilian supply to keep the shipyards fed."

  wa_mp_fix_sov_mass_reserve_stockpiles_tt:0 "Gain national spirit: §YMass Reserve Stockpiles§!."
  wa_mp_fix_sov_mass_reserve_stockpiles:0 "Mass Reserve Stockpiles"
  wa_mp_fix_sov_mass_reserve_stockpiles_desc:0 "The Soviet force system is built around mobilization. In peacetime, formations keep only a cadre and are meant to be filled out from the reserve in wartime. That demands huge pre-war stockpiles: rifles, heavy infantry kit, artillery and support equipment must be ready before the call-up begins."

  
  wa_mp_fix_sov_production_bonus.1.t:0 "Mass Reserve Stockpiles"
  wa_mp_fix_sov_production_bonus.1.d:0 "The Soviet force system is built around mobilization. In peacetime, formations keep only a cadre and are meant to be filled out from the reserve in wartime. That demands huge pre-war stockpiles: rifles, heavy infantry kit, artillery and support equipment must be ready before the call-up begins."
  wa_mp_fix_sov_production_bonus.1.a:0 "Issue the production orders."

  wa_mp_fix_sov_industry.4.t:0 "Southern Arsenal Expansion"
  wa_mp_fix_sov_industry.4.d:0 "The southern industrial belt is ordered to shift from ‘capacity on paper’ to steel on rails. Krasnodar and Rostov-on-Don are designated as priority hubs for armaments output: new shop floors are laid out, machine tools reallocated, and entire production lines standardized for fast throughput. The logic is blunt. These cities sit close enough to the rail spine to feed the front quickly, yet far enough to avoid the immediate strain of the western bottlenecks. From rifle parts and support gear to artillery components, the South will now work in wartime rhythms even before the war arrives."
  wa_mp_fix_sov_industry.4.a:0 "Turn the South into an arsenal."
  
  wa_mp_fix_GER_doctrine_mastery_category:0 "German Doctrine Mastery"
  wa_mp_fix_GER_doctrine_mastery_category_desc:0 "Special decisions related to German doctrine development."
  
  GER_free_armour_mastery:0 "Expand Armour Doctrine Expertise"
  GER_free_armour_mastery_desc:0 "Gain 100 free mastery in the next uncompleted armour doctrine track."

  wa_mp_fix_JAP_doctrine_mastery_category:0 "Japanese Doctrine Mastery"
  wa_mp_fix_JAP_doctrine_mastery_category_desc:0 "Special decisions related to Japanese doctrine development."

  JAP_free_infantry_mastery:0 "Expand Infantry Doctrine Expertise"
  JAP_free_infantry_mastery_desc:0 "Gain 100 free mastery in the next uncompleted infantry doctrine track."
