l_english:
  land_mastery_boost:0 "Doctrine Intensification (1939+)"
  land_mastery_boost_desc:0 "From 1 January 1939 onward, countries accelerate land doctrine development, increasing doctrine mastery gain."

  GER_unreliable_torpedoes:0 "Unreliable Torpedoes"
  GER_unreliable_torpedoes_desc:0 "Defective exploders and depth-keeping issues have severely reduced the effectiveness of torpedoes and naval air strikes."

  ita_special_resources:0 "Italian Resource Program"
  ita_special_resources_desc:0 "Extra resources are available while Italy controls this state."

  wa_mp_fix_germany.1.t:0 "France Capitulated"
  wa_mp_fix_germany.1.d:0 "With France out of the fight, Germany can redirect manpower to new fronts."
  wa_mp_fix_germany.1.a:0 "Proceed."
  
  wa_mp_fix_sov_industry.1.t: "Western Industrial Expansion: Riga, Minsk, Kyiv"
  wa_mp_fix_sov_industry.1.d: "New construction brigades and equipment are redirected to the western industrial belt. To concentrate output where it matters most, factory construction is being fast-tracked in Riga, Minsk, and Kyiv."
  wa_mp_fix_sov_industry.1.a: "Authorize the builds in Riga, Minsk, and Kyiv."
  
  wa_mp_fix_sov_industry.2.t: "Western Arsenal Program: Riga, Minsk, Kyiv"
  wa_mp_fix_sov_industry.2.d: "Production is shifted toward military needs. New military plants in Riga, Minsk, and Kyiv will shorten delivery times and reduce strain on long-distance supply routes."
  wa_mp_fix_sov_industry.2.a: "Expand the arsenal in Riga, Minsk, and Kyiv."
  
  wa_mp_fix_sov_industry.3.t: "Resource Corridor Beyond the Urals"
  wa_mp_fix_sov_industry.3.d: "Engineering units are dispatched to expand roads, depots, and utilities around remote extraction hubs. Better logistics means more reliable output."
  wa_mp_fix_sov_industry.3.a: "Send the engineers."

